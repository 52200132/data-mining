[project]
name = "news-data-mining"
version = "0.1.0"
description = "Hệ thống thu thập và tiền xử lý dữ liệu báo chí tiếng Việt để huấn luyện AI"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
  # "requests>=2.31.0",
  # "beautifulsoup4>=4.12.0",
  "scrapy>=2.11.0",
  # "scrapy-playwright>=0.0.35", # Nếu bạn cần cào trang dùng Javascript
  "python-dotenv>=1.0.0", # Để đọc file .env bảo mật
  "playwright>=1.40.0",
  "pandas>=2.1.0",
  "jsonschema>=4.19.0",
  "trafilatura>=1.6.0",   # Thư viện bóc tách nội dung báo chí cực sạch
  "underthesea>=6.1.0",   # Tách từ tiếng Việt
  "regex (>=2026.4.4,<2027.0.0)",
  "unidecode (>=1.4.0,<2.0.0)",
  "matplotlib (>=3.10.8,<4.0.0)",
  "seaborn (>=0.13.2,<0.14.0)",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0", # Format code tự động
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.scrapy]
settings = "src.crawler_bot.settings"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
